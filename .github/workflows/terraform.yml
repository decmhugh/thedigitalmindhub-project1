name: terraform
on:
  pull_request:
    paths: [infra/**, src/**, tests/**]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: terraform-linters/setup-tflint@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: terraform -chdir=infra fmt -check -recursive
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra validate
      - run: tflint --chdir=infra --init && tflint --chdir=infra
      - run: pip install pytest checkov && pytest tests && checkov -d infra
