<path d="M190 135 H310" class="l"/>
<text x="250.0" y="129" text-anchor="middle" class="t">1. POST /agent/invoke (prompt, file?)</text>
<path d="M310 181 H430" class="l"/>
<text x="370.0" y="175" text-anchor="middle" class="t">2. invoke (throttled)</text>
<path d="M430 227 H550" class="l"/>
<text x="490.0" y="221" text-anchor="middle" class="t">3. validate auth_session cookie</text>
<path d="M550 273 H430" class="l" stroke-dasharray="6 4"/>
<text x="490.0" y="267" text-anchor="middle" class="t">4. user (phone hash)</text>
<path d="M430 319 H550" class="l"/>
<text x="490.0" y="313" text-anchor="middle" class="t">5. take session lock, write job (pending)</text>
<path d="M430 365 H670" class="l"/>
<text x="550.0" y="359" text-anchor="middle" class="t">6. async invoke (Event)</text>
<path d="M430 411 H310" class="l" stroke-dasharray="6 4"/>
<text x="370.0" y="405" text-anchor="middle" class="t">7. 202 {job_id} | 409 busy</text>
<path d="M310 457 H190" class="l" stroke-dasharray="6 4"/>
<text x="250.0" y="451" text-anchor="middle" class="t">8. browser polls GET /agent/jobs/{id} every 2-5 s</text>
<path d="M670 503 H790" class="l"/>
<text x="730.0" y="497" text-anchor="middle" class="t">9. if file: read (owner prefix checked by invoke)</text>
<path d="M790 549 H670" class="l" stroke-dasharray="6 4"/>
<text x="730.0" y="543" text-anchor="middle" class="t">10. file bytes (base64)</text>
<path d="M670 595 H910" class="l"/>
<text x="790.0" y="589" text-anchor="middle" class="t">11. InvokeAgentRuntime (session = hash(user, cookie))</text>
<path d="M910 641 H1030" class="l"/>
<text x="970.0" y="635" text-anchor="middle" class="t">12. load conversation checkpoint</text>
<path d="M1030 687 H910" class="l" stroke-dasharray="6 4"/>
<text x="970.0" y="681" text-anchor="middle" class="t">13. prior messages</text>
<path d="M910 733 H1150" class="l"/>
<text x="1030.0" y="727" text-anchor="middle" class="t">14. Converse: history + prompt (+ image/document block)</text>
<path d="M1150 779 H910" class="l" stroke-dasharray="6 4"/>
<text x="1030.0" y="773" text-anchor="middle" class="t">15. answer, or tool call</text>
<path d="M910 825 H1270" class="l"/>
<text x="1090.0" y="819" text-anchor="middle" class="t">16. direct SDK call: run_python, browse_page</text>
<path d="M1270 871 H910" class="l" stroke-dasharray="6 4"/>
<text x="1090.0" y="865" text-anchor="middle" class="t">17. tool result (untrusted data)</text>
<path d="M910 917 H1390" class="l"/>
<text x="1150.0" y="911" text-anchor="middle" class="t">18. MCP tools/call: say_hello (SigV4)</text>
<path d="M1390 963 H1510" class="l"/>
<text x="1450.0" y="957" text-anchor="middle" class="t">19. lambda:Invoke</text>
<path d="M1510 1009 H1390" class="l" stroke-dasharray="6 4"/>
<text x="1450.0" y="1003" text-anchor="middle" class="t">20. result</text>
<path d="M1390 1055 H910" class="l" stroke-dasharray="6 4"/>
<text x="1150.0" y="1049" text-anchor="middle" class="t">21. MCP tool result (untrusted data)</text>
<path d="M910 1101 H1150" class="l"/>
<text x="1030.0" y="1095" text-anchor="middle" class="t">22. Converse: tool result</text>
<path d="M1150 1147 H910" class="l" stroke-dasharray="6 4"/>
<text x="1030.0" y="1141" text-anchor="middle" class="t">23. final answer</text>
<path d="M910 1193 H1030" class="l"/>
<text x="970.0" y="1187" text-anchor="middle" class="t">24. save checkpoint</text>
<path d="M910 1239 H670" class="l" stroke-dasharray="6 4"/>
<text x="790.0" y="1233" text-anchor="middle" class="t">25. response or blocked flag</text>
<path d="M670 1285 H550" class="l"/>
<text x="610.0" y="1279" text-anchor="middle" class="t">26. save result (done | failed), release lock</text>
<path d="M190 1331 H310" class="l"/>
<text x="250.0" y="1325" text-anchor="middle" class="t">27. GET /agent/jobs/{id}</text>
<path d="M310 1377 H550" class="l"/>
<text x="430.0" y="1371" text-anchor="middle" class="t">28. read job (via status Lambda)</text>
<path d="M310 1423 H190" class="l" stroke-dasharray="6 4"/>
<text x="250.0" y="1417" text-anchor="middle" class="t">29. 200 done: response shown in chat</text>
